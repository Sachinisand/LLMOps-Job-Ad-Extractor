"0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0;0.5709;0.5827;1" values="0;0;420;420"/></rect></clipPath><text class="mono" x="38" y="258" clip-path="url(#c1_6)">language is English – German skills are</text><clipPath id="c1_7"><rect x="36" y="264" height="20" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0;0.5827;0.5945;1" values="0;0;420;420"/></rect></clipPath><text class="mono" x="38" y="279" clip-path="url(#c1_7)">welcome but optional.</text><clipPath id="c1_8"><rect x="36" y="285" height="20" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0;0.5945;0.6064;1" values="0;0;420;420"/></rect></clipPath><text class="mono" x="38" y="300" clip-path="url(#c1_8)">Work from anywhere in Germany. Package: up to</text><clipPath id="c1_9"><rect x="36" y="306" height="20" width="0"><animate attributeName="width" dur="22.0s" repeatCount="indefinite" keyTimes="0;0.6064;0.6182;1" values="0;0;420;420"/></rect></clipPath><text class="mono" x="38" y="321" clip-path="url(#c1_9)">EUR 105,000.</text><g opacity="0"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.6295;0.6318;0.7091;0.7114;1.0000" values="0;0;1;1;0;0"/><text class="sub" x="510" y="138">llama3.2:3b is reading the ad …</text><text class="small" x="510" y="190">(sped up in this clip)</text></g><text class="clock" x="510" y="166" opacity="0"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.6314;0.6318;0.6404;0.6409;1.0000" values="0;0;1;1;0;0"/> 0.0 s</text><text class="clock" x="510" y="166" opacity="0"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.6399;0.6404;0.6490;0.6494;1.0000" values="0;0;1;1;0;0"/> 1.2 s</text><text class="clock" x="510" y="166" opacity="0"><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" keyTimes="0.0000;0.6485;0.6490;0.6576;0.6580;1.0000" va